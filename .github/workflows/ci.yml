name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q .agents tests
      - run: python .agents/skills/maintain-lambda-api-decorators/scripts/load_api_contract.py --checkout tests/fixtures/checkout_unreleased --json
      - run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.agents/skills')
          for name in ('build-with-lambda-api-decorators', 'maintain-lambda-api-decorators'):
              skill = root / name
              assert (skill / 'SKILL.md').is_file()
              assert not list(skill.rglob('api-contract.json'))
              assert not list(skill.rglob('behavior.md'))
          PY
      - run: git diff --check
