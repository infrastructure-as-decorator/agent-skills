name: Publish Agent Skills

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable catalog version, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pyyaml
      - name: Ensure GitHub CLI 2.90.0 or newer
        shell: bash
        run: |
          set -euo pipefail
          required=2.90.0
          current="$(gh --version | awk 'NR == 1 {print $3}')"
          if [ "$(printf '%s\n' "$current" "$required" | sort -V | head -n1)" != "$required" ]; then
            case "$(uname -m)" in
              x86_64) gh_arch=amd64 ;;
              aarch64) gh_arch=arm64 ;;
              *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            archive="gh_${required}_linux_${gh_arch}.tar.gz"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${required}/${archive}" -o "$RUNNER_TEMP/$archive"
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            mkdir -p "$RUNNER_TEMP/gh-bin"
            cp "$RUNNER_TEMP/gh_${required}_linux_${gh_arch}/bin/gh" "$RUNNER_TEMP/gh-bin/gh"
            chmod +x "$RUNNER_TEMP/gh-bin/gh"
            echo "$RUNNER_TEMP/gh-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/gh-bin:$PATH"
          fi
          gh --version
      - name: Validate version, main ancestry, and existing state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi

          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main

          if git ls-remote --exit-code origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            release_error="$RUNNER_TEMP/release-query-error"
            set +e
            release_tag="$(gh release view "$VERSION" --json tagName --jq .tagName 2>"$release_error")"
            release_status=$?
            set -e
            if [ "$release_status" -eq 0 ] && [ "$release_tag" = "$VERSION" ]; then
              echo "Release $VERSION already exists; publication will not run again."
              echo "already_published=true" >> "$GITHUB_OUTPUT"
            elif grep -Eiq 'not found|could not find' "$release_error"; then
              echo "Tag $VERSION exists without a release; repair that state manually before retrying." >&2
              exit 1
            else
              cat "$release_error" >&2
              exit "$release_status"
            fi
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pytest -q
      - run: python -m compileall -q skills tests
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("skills")
          names = {p.name for p in root.iterdir() if p.is_dir()}
          assert names == {"build-with-lambda-api-decorators", "maintain-lambda-api-decorators"}
          for name in names:
              text = (root / name / "SKILL.md").read_text()
              match = re.search(r"^name: (.+)$", text, re.MULTILINE)
              assert match and match.group(1) == name
      - run: python skills/maintain-lambda-api-decorators/scripts/load_api_contract.py --checkout tests/fixtures/checkout_unreleased --json
      - run: gh skill publish --dry-run
        if: steps.state.outputs.already_published != 'true'
      - name: Publish catalog and create release
        if: steps.state.outputs.already_published != 'true'
        run: gh skill publish --tag "$VERSION"
      - run: gh release view "$VERSION"
      - run: git diff --check
