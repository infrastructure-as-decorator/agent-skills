name: Publish Agent Skills

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pyyaml
      - name: Ensure GitHub CLI 2.90.0 or newer
        shell: bash
        run: |
          set -euo pipefail
          required=2.90.0
          current="$(gh --version | awk 'NR == 1 {print $3}')"
          if [ "$(printf '%s\n' "$current" "$required" | sort -V | head -n1)" != "$required" ]; then
            case "$(uname -m)" in
              x86_64) gh_arch=amd64 ;;
              aarch64) gh_arch=arm64 ;;
              *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            archive="gh_${required}_linux_${gh_arch}.tar.gz"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${required}/${archive}" -o "$RUNNER_TEMP/$archive"
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
            mkdir -p "$RUNNER_TEMP/gh-bin"
            cp "$RUNNER_TEMP/gh_${required}_linux_${gh_arch}/bin/gh" "$RUNNER_TEMP/gh-bin/gh"
            chmod +x "$RUNNER_TEMP/gh-bin/gh"
            echo "$RUNNER_TEMP/gh-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/gh-bin:$PATH"
          fi
          gh --version
      - name: Validate tag and ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin main --tags
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - name: Detect existing release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if release_tag="$(gh release view "$GITHUB_REF_NAME" --json tagName --jq .tagName 2>/dev/null)"; then
            test "$release_tag" = "$GITHUB_REF_NAME"
            echo "Release $GITHUB_REF_NAME already exists; publication will not run again."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pytest -q
      - run: python -m compileall -q skills tests
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("skills")
          names = {p.name for p in root.iterdir() if p.is_dir()}
          assert names == {"build-with-lambda-api-decorators", "maintain-lambda-api-decorators"}
          for name in names:
              text = (root / name / "SKILL.md").read_text()
              match = re.search(r"^name: (.+)$", text, re.MULTILINE)
              assert match and match.group(1) == name
      - run: python skills/maintain-lambda-api-decorators/scripts/load_api_contract.py --checkout tests/fixtures/checkout_unreleased --json
      - run: gh skill publish --dry-run
        if: steps.release.outputs.already_published != 'true'
      - name: Publish tagged catalog
        if: steps.release.outputs.already_published != 'true'
        run: gh skill publish --tag "$GITHUB_REF_NAME"
      - run: gh release view "$GITHUB_REF_NAME"
      - run: git diff --check
